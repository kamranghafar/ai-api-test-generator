[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-api-test-generator"
version = "1.0.0"
description = "Generate comprehensive API tests from OpenAPI/Swagger specs using AI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Kamran Ghaffar", email = "kamranghafar@gmail.com"},
]
keywords = [
    "api-testing", "openapi", "swagger", "postman", "pytest",
    "test-automation", "ai", "rest-assured", "test-generation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.1.0",
    "openai>=1.0.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "jsonschema>=4.20.0",
    "rich>=13.0.0",
    "jinja2>=3.1.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[project.scripts]
ai-test-gen = "ai_api_test_generator.cli:main"

[project.urls]
Homepage = "https://github.com/kamranghafar/ai-api-test-generator"
Repository = "https://github.com/kamranghafar/ai-api-test-generator"
Issues = "https://github.com/kamranghafar/ai-api-test-generator/issues"

[tool.setuptools.packages.find]
include = ["ai_api_test_generator*"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
