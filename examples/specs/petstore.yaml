openapi: "3.0.3"
info:
  title: Petstore API
  description: A sample API for managing pets in a store
  version: "1.0.0"
  contact:
    name: API Support
    email: support@petstore.example.com
servers:
  - url: https://petstore.example.com/api/v1
    description: Production server

paths:
  /pets:
    get:
      operationId: listPets
      summary: List all pets
      tags: [pets]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Maximum number of pets to return
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [available, pending, sold]
          description: Filter by pet status
      responses:
        "200":
          description: A list of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
        "400":
          description: Invalid query parameters
    post:
      operationId: createPet
      summary: Create a new pet
      tags: [pets]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPet"
      responses:
        "201":
          description: Pet created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "400":
          description: Invalid input
        "401":
          description: Unauthorized

  /pets/{petId}:
    get:
      operationId: getPetById
      summary: Get a pet by ID
      tags: [pets]
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
          description: The ID of the pet
      responses:
        "200":
          description: Pet details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "404":
          description: Pet not found
    put:
      operationId: updatePet
      summary: Update an existing pet
      tags: [pets]
      security:
        - bearerAuth: []
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPet"
      responses:
        "200":
          description: Pet updated
        "404":
          description: Pet not found
        "401":
          description: Unauthorized
    delete:
      operationId: deletePet
      summary: Delete a pet
      tags: [pets]
      security:
        - bearerAuth: []
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Pet deleted
        "404":
          description: Pet not found
        "401":
          description: Unauthorized

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Pet:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Buddy"
        species:
          type: string
          example: "dog"
        status:
          type: string
          enum: [available, pending, sold]
          example: "available"
        tags:
          type: array
          items:
            type: string

    NewPet:
      type: object
      required: [name, species]
      properties:
        name:
          type: string
          example: "Buddy"
          minLength: 1
          maxLength: 100
        species:
          type: string
          example: "dog"
        status:
          type: string
          enum: [available, pending, sold]
          default: available
        tags:
          type: array
          items:
            type: string
